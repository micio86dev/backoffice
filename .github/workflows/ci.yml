name: CI — backoffice

# Every long-lived branch, not just develop. With develop alone, a release/**
# or hotfix/** branch reached main without this suite ever running — so the one
# merge that ships to production was the least tested one in the flow.
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']

jobs:
  ci:
    name: Lint, Test & E2E
    runs-on: ubuntu-latest
    # Pinned Playwright image: browsers + system deps preinstalled, and the
    # SAME rendering environment the committed screenshot baselines (-linux)
    # were generated in — keeps visual regression deterministic (100% green).
    container: mcr.microsoft.com/playwright:v1.61.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned Playwright image ships neither unzip nor bun, and setup-bun
      # downloads a .zip. Without this the next step fails with "Unable to
      # locate executable file: unzip" — which is the real reason this used to
      # be `npm install -g bun`.
      - name: Install unzip (absent from the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq unzip

      - name: Install Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NON-BLOCKING, deliberately, dated, and NOT silenced.
      #
      # Every advisory here is a TRANSITIVE build-toolchain dependency with no
      # fix reachable from our pinned versions. Clearing the critical one
      # (@nuxt/devtools) needs Nuxt >= 4.5.1, which pulls Vite 8 / Rolldown and
      # breaks `nuxt generate` with two `builtin:vite-json` failures the bundler
      # never attributes to a module. `overrides` cannot help either: `nuxt` is
      # itself a flagged DIRECT dependency.
      #
      # `--ignore` was tried first and does NOT work on bun 1.3.14 — it neither
      # filters the listed ids from the report nor changes the exit code.
      # `continue-on-error` is therefore the mechanism, and it is the more
      # honest one: the full advisory list still prints on every run and the
      # step shows as failed-but-tolerated rather than quietly passing.
      #
      # REVIEW BY 2026-11-13 — re-run without this and delete it once upstream
      # ships fixes. A bypass nobody revisits stops being a decision and
      # becomes a blind spot.
      - name: Security audit
        run: bun audit
        continue-on-error: true
        # Exits non-zero on HIGH/CRITICAL vulnerabilities

      - name: Prettier format-check
        run: bun run format:check

      - name: TypeScript type-check
        run: bun run typecheck

      - name: Client drift check
        run: bun run codegen:check

      - name: Vitest unit tests + coverage
        run: node node_modules/.bin/vitest run --coverage --coverage.thresholds.lines=85

      - name: Playwright E2E (chromium + webkit + mobile, incl. visual regression)
        # webServer (playwright.config) runs `nuxt generate` + static serve; browsers
        # come from the container image (no `playwright install` needed).
        run: node node_modules/.bin/playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-backoffice
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: |
          docker build -t beai-backoffice:ci \
            --build-arg NUXT_PUBLIC_API_BASE=/api \
            --build-arg BEAI_API_ORIGIN=https://ci.example.test .

      # The Dockerfile guard is the only thing standing between a missing build
      # arg and an image that passes its healthcheck, serves the login page, and
      # sends every visitor's credentials to a port on their OWN machine. That
      # shipped once. A guard nobody has watched fail is not a guard.
      - name: Guard — a build with no API base must fail
        run: |
          if docker build -t beai-backoffice:should-not-exist . > /tmp/noarg.log 2>&1; then
            echo "::error::Build succeeded without NUXT_PUBLIC_API_BASE — the guard is not working."
            exit 1
          fi

          if ! grep -q "build arg NUXT_PUBLIC_API_BASE is required" /tmp/noarg.log; then
            echo "::error::Build failed, but not for the expected reason:"
            tail -40 /tmp/noarg.log
            exit 1
          fi

          echo "Guard fired as expected."

      # Same reasoning as the guard above, for the two gates that keep Safari
      # working: `up.railway.app` is a public suffix, so an ABSOLUTE api base
      # makes the api a different SITE, the refresh cookie third-party, and
      # WebKit drops it — logging every Safari operator out on each reload with
      # nothing failing anywhere. A guard nobody has watched fail is not a guard.
      - name: Guard — an ABSOLUTE API base must fail the build
        run: |
          if docker build -t beai-backoffice:should-not-exist \
              --build-arg NUXT_PUBLIC_API_BASE=https://ci.example.test/api \
              --build-arg BEAI_API_ORIGIN=https://ci.example.test . > /tmp/abs.log 2>&1; then
            echo "::error::Build succeeded with an absolute NUXT_PUBLIC_API_BASE — the guard is not working."
            exit 1
          fi

          if ! grep -q "NUXT_PUBLIC_API_BASE must be RELATIVE" /tmp/abs.log; then
            echo "::error::Build failed, but not for the expected reason:"
            tail -40 /tmp/abs.log
            exit 1
          fi

          echo "Guard fired as expected."

      - name: Guard — a build with no proxy target must fail
        run: |
          if docker build -t beai-backoffice:should-not-exist \
              --build-arg NUXT_PUBLIC_API_BASE=/api . > /tmp/noorigin.log 2>&1; then
            echo "::error::Build succeeded without BEAI_API_ORIGIN — the backoffice would have no API at all."
            exit 1
          fi

          if ! grep -q "build arg BEAI_API_ORIGIN is required" /tmp/noorigin.log; then
            echo "::error::Build failed, but not for the expected reason:"
            tail -40 /tmp/noorigin.log
            exit 1
          fi

          echo "Guard fired as expected."

      - name: Assert the API base reached the served bundle
        run: |
          BAKED=$(docker run --rm --entrypoint sh beai-backoffice:ci -c \
            "grep -o 'apiBase:\"[^\"]*\"' /usr/share/nginx/html/index.html")
          echo "Baked: $BAKED"
          [ "$BAKED" = 'apiBase:"/api"' ] || {
            echo "::error::Wrong API base baked into the image."; exit 1; }

      # Proving the arg was passed is a different check from proving nginx will
      # act on it — the same distinction the bundle assertion above draws.
      - name: Assert nginx will proxy /api/ to the API service
        run: |
          CONF=$(docker run --rm --entrypoint sh beai-backoffice:ci -c \
            "cat /etc/nginx/conf.d/default.conf")
          echo "$CONF" | grep -q 'location \^~ /api/' || {
            echo "::error::No /api/ proxy location in the served nginx config."; exit 1; }
          echo "$CONF" | grep -q 'proxy_pass https://ci.example.test;' || {
            echo "::error::proxy_pass is missing, or carries a URI part that would rewrite the request path."
            echo "$CONF" | grep proxy_pass
            exit 1; }
